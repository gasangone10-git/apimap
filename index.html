<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="장소를 검색해 두 지점 사이의 운전 경로 거리와 지도를 확인하세요."
    />
    <meta name="theme-color" content="#f5f7f2" />
    <title>어디까지? — 거리 측정</title>
    <link rel="preconnect" href="https://nominatim.openstreetmap.org" />
    <link rel="preconnect" href="https://router.project-osrm.org" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
      defer
    ></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="wordmark" href="./" aria-label="어디까지? 홈">
          <span class="wordmark-icon" aria-hidden="true">↗</span>
          어디까지?
        </a>
        <span class="topbar-note">OPEN MAPS, OPEN ROADS</span>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div class="eyebrow"><span></span> 두 장소 사이의 길 찾기</div>
        <h1 id="page-title">어디서 어디까지,<br /><em>얼마나 멀까요?</em></h1>
        <p class="hero-copy">
          장소 이름이나 주소를 입력하면 실제 운전 경로와 거리를 알려드려요.
        </p>
      </section>

      <section class="search-panel" aria-label="출발지와 도착지 입력">
        <form id="route-form">
          <div class="location-fields">
            <label class="location-field" for="origin">
              <span class="field-marker start-marker" aria-hidden="true"></span>
              <span class="field-content">
                <span class="field-label">출발지</span>
                <input
                  id="origin"
                  name="origin"
                  type="search"
                  placeholder="예: 서울역"
                  autocomplete="street-address"
                  required
                />
              </span>
            </label>
            <button
              class="swap-button"
              id="swap-button"
              type="button"
              aria-label="출발지와 도착지 바꾸기"
              title="출발지와 도착지 바꾸기"
            >
              ⇅
            </button>
            <label class="location-field" for="destination">
              <span class="field-marker end-marker" aria-hidden="true"></span>
              <span class="field-content">
                <span class="field-label">도착지</span>
                <input
                  id="destination"
                  name="destination"
                  type="search"
                  placeholder="예: 부산역"
                  autocomplete="street-address"
                  required
                />
              </span>
            </label>
          </div>
          <button class="submit-button" id="submit-button" type="submit">
            <span>거리 확인하기</span>
            <span class="submit-arrow" aria-hidden="true">→</span>
          </button>
        </form>
        <p class="search-hint">
          <span aria-hidden="true">✳</span> 지도에서 검색되는 실제 장소만 안내해요.
        </p>
      </section>

      <p class="status-message" id="status-message" role="status" aria-live="polite"></p>

      <section class="result-panel" id="result-panel" aria-labelledby="result-title" hidden>
        <div class="result-heading">
          <div>
            <p class="result-kicker" id="result-title">두 장소 사이의 운전 경로</p>
            <p class="route-label" id="route-label"></p>
          </div>
          <span class="route-badge"><span></span> 자동차 경로</span>
        </div>
        <div class="distance-row">
          <span class="distance-value" id="distance-value"></span>
          <span class="distance-unit" id="distance-unit"></span>
        </div>
        <a class="map-link" id="map-link" target="_blank" rel="noopener noreferrer">
          <span class="map-link-icon" aria-hidden="true">⌖</span>
          <span>지도에서 보기</span>
          <span class="map-link-arrow" aria-hidden="true">↗</span>
        </a>
        <div class="map-frame" id="map-frame" aria-label="운전 경로 지도">
          <div id="map"></div>
        </div>
        <p class="map-attribution">
          지도 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>
          · 경로 © <a href="https://project-osrm.org/" target="_blank" rel="noopener noreferrer">OSRM</a>
        </p>
      </section>

      <footer class="page-footer">
        <span>장소 검색은 OpenStreetMap 데이터를 사용합니다.</span>
        <span>안전 운전하세요 <span aria-hidden="true">✳</span></span>
      </footer>
    </main>
  </body>
</html>
